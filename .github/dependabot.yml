version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # 관련 의존성을 하나의 PR로 묶어 리뷰 부담을 줄인다
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          # kotlin("jvm"), kotlin("plugin.spring") 같은 플러그인은 이 이름으로 잡힌다
          - "jvm"
          - "plugin.*"
      spring:
        patterns:
          - "org.springframework*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
