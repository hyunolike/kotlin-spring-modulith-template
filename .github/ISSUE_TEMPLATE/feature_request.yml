name: ✨ Feature Request
description: Suggest an improvement for this template
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or missing capability.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to see, and roughly how it could work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: boundary
    attributes:
      label: Module boundary check
      options:
        - label: This proposal keeps the module boundary rules intact (no cycles, facade/event communication only)
          required: false
