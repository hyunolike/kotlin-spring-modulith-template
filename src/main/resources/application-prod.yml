spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

# API 문서와 Swagger UI는 운영 환경에 노출하지 않는다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 운영 로그는 한 줄 JSON(ECS)으로 남긴다. 로그 수집기가 파싱 규칙 없이 읽을 수 있고,
# MDC 값(requestId 등)은 별도 필드로 들어간다.
logging:
  structured:
    format:
      console: ecs
