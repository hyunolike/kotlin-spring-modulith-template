spring:
  application:
    name: kotlin-spring-modulith-template
  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway(db/migration)가 관리한다. 엔티티와 어긋나면 기동 시 실패한다
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  modulith:
    events:
      # 재시작 시 일괄 재발행은 끈다. 다른 인스턴스가 처리 중인 이벤트까지 다시 보내기 때문이다.
      # 실패한 이벤트는 EventPublicationMaintenance가 주기적으로 다시 제출한다.
      republish-outstanding-events-on-restart: false
      completion-mode: archive # 완료된 이벤트는 event_publication_archive로 옮겨 운영 테이블이 자라지 않게 한다
      # 이 시간 넘게 끝나지 않은 이벤트는 FAILED로 바꿔 재제출 대상에 올린다 (처리 중 인스턴스가 죽은 경우 등).
      # 리스너의 최대 실행 시간보다 길게 잡는다.
      staleness:
        published: 5m
        processing: 5m
        resubmitted: 5m
    runtime:
      verification-enabled: true # 기동 시에도 모듈 경계 검증 — 위반이 있으면 앱이 뜨지 않는다 (Modulith 2.0+)
      # 마이그레이션을 모듈별로 나눠 실행한다: db/migration/<모듈명>/V{n}__*.sql.
      # 모듈마다 이력 테이블(flyway_schema_history_<모듈명>)과 버전 번호를 따로 가진다.
      flyway-enabled: true

management:
  otlp:
    metrics:
      export:
        # 기본값(true)이면 수집기가 없어도 1분마다 localhost:4318로 지표를 보내려다 실패 로그를 남긴다.
        # OTLP 수집기를 붙일 때 켠다. 트레이스는 수집기 주소를 설정하기 전에는 전송하지 않는다.
        enabled: false

logging:
  pattern:
    # 로그 한 줄마다 요청 ID(MdcLoggingFilter)와 추적 ID(OpenTelemetry)를 찍는다.
    # 비동기 리스너의 로그도 같은 값으로 묶인다.
    correlation: "[%X{requestId:-},%X{traceId:-}] "
  level:
    # staleness 모니터가 1분마다 상태별로 "No stale publications … found"를 INFO로 남긴다 (하루 4천 줄 이상).
    # 실패로 바뀐 이벤트는 event_publication 테이블의 status = 'FAILED'로 확인한다.
    org.springframework.modulith.events.core.DefaultEventPublicationRegistry: warn

springdoc:
  swagger-ui:
    path: /swagger-ui.html

template:
  events:
    resubmission:
      interval: PT1M # 실패한 이벤트를 다시 제출하는 주기
      max-attempts: 10 # 첫 시도를 포함한 총 시도 횟수. 다 채우면 자동 재제출을 멈추고 FAILED로 남긴다
    archive:
      retention: P30D # 완료 이벤트 보존 기간
      purge-cron: "0 0 4 * * *" # 매일 04:00에 보존 기간이 지난 완료 이벤트 삭제

---
# 운영이 아닌 환경(로컬, 테스트)에서만 켜는 설정
spring:
  config:
    activate:
      on-profile: "!prod"

logging:
  level:
    com.template: debug
    org.hibernate.SQL: debug
